server:
  port: 8083

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: order-service
  profiles:
    active: mock
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

catalog:
  base-url: ${CATALOG_URL}

inventory:
  base-url: ${INVENTORY_URL}
  mock: ${INVENTORY_MOCK}
  service-jwt:
    secret: ${INVENTORY_SERVICE_JWT_SECRET}

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    jwk-set-uri: ${JWT_JWK_SET_URI}
    audience: ${JWT_AUDIENCE:bookstore}

payments:
  vnpay:
    enabled: ${VNPAY_ENABLED:false}
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}

orders:
  recovery:
    enabled: ${ORDER_RECOVERY_ENABLED:true}
    delay-ms: ${ORDER_RECOVERY_DELAY_MS:10000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

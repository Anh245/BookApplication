server:
  port: 8080


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: catalog-service
              uri: lb://catalog-service
              predicates:
                - Path=/api/catalog/**
            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/api/ai/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**,/api/cart/**,/api/payments/**
            - id: order-service-legacy
              uri: lb://order-service
              predicates:
                - Path=/orders/**
              filters:
                - PrefixPath=/api
            - id: user-services
              uri: lb://user-services
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/admin/users/**,/.well-known/jwks.json

            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/**
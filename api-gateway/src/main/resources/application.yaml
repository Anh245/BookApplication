server:
  port: 8080


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: catalog-service
              uri: lb://catalog-service
              predicates:
                - Path=/api/catalog/**
            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/api/ai/**
            - id: book-service
              uri: lb://book-service
              predicates:
                - Path=/books/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/orders/**

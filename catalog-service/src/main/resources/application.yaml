server:
  port: ${PORT:8084}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${CATALOG_DB_URL}
    username: ${CATALOG_DB_USER}
    password: ${CATALOG_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
    audience: ${JWT_AUDIENCE:bookstore}

app:
  docs:
    enabled: ${SWAGGER_ENABLED:true}
springdoc:
  api-docs:
    enabled: ${app.docs.enabled}
  swagger-ui:
    enabled: ${app.docs.enabled}
    persist-authorization: false
  paths-to-match: /api/catalog/**
